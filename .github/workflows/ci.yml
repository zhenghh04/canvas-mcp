name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - run: pip install -e ".[dev]"

      # The suite is fully offline: the fixture transport raises on any
      # unexpected request, so a test that reaches the network fails here.
      - run: pytest -q

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  smoke:
    name: server builds and publishes the expected surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .

      # A green unit suite can still coexist with a server that won't start, so
      # exercise the real entry points. No token: these must work unconfigured.
      - name: CLI entry points respond
        run: |
          canvas-mcp --help
          canvas-mcp tools
          canvas-mcp config

      - name: Default posture is writes-on, deletes-off
        env:
          CANVAS_BASE_URL: https://example.instructure.com
          CANVAS_API_TOKEN: ci-not-a-real-token
        run: |
          python - <<'PY'
          import asyncio
          from canvas_mcp.config import Config
          from canvas_mcp.server import build_server

          names = {
              t.name
              for t in asyncio.run(
                  build_server(Config.from_env()).mcp.list_tools()
              )
          }
          assert "canvas_grade_submission" in names, "writes should be on by default"
          assert "canvas_delete_page" not in names, "deletes should be off by default"
          assert len(names) == 42, f"expected 42 published tools, got {len(names)}"
          print(f"ok: {len(names)} tools published")
          PY
